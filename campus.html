<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F2;
    --surface:#FFFFFF;
    --border:#E3E1D8;
    --border-strong:#CFCCC0;
    --ink:#1B1D1B;
    --ink-2:#5B5E58;
    --ink-3:#93968E;
    --accent:#1F4D3A;
    --accent-dark:#163A2B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7EEE9;
    --gold:#A8791E;
    --gold-soft:#FAF1DD;
    --grey-soft:#EDECE6;
    --radius:10px;
    --radius-sm:6px;
    --shadow-card: 0 1px 2px rgba(27,29,27,0.04);
    --shadow-modal: 0 12px 40px rgba(27,29,27,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,.serif{ font-family:'Lora',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{color:inherit;}
  button{font-family:inherit;}
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  ::selection{ background:var(--accent-soft); }

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  @media (max-width:640px){ .wrap{padding:0 16px;} }

  /* ---------- Nav ---------- */
  header.nav{
    position:sticky; top:0; z-index:40;
    background:rgba(247,246,242,0.92);
    backdrop-filter:saturate(120%) blur(6px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:64px; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; letter-spacing:-0.01em; }
  .brand-mark{ width:26px; height:26px; border-radius:6px; background:var(--accent); position:relative; flex:none; }
  .brand-mark::after{ content:""; position:absolute; left:6px; right:6px; top:8px; height:2px; background:var(--accent-ink); box-shadow:0 5px 0 var(--accent-ink); opacity:0.9; }
  .nav-links{ display:flex; gap:4px; align-items:center; }
  .nav-links a{
    text-decoration:none; font-size:14.5px; font-weight:500; color:var(--ink-2);
    padding:8px 14px; border-radius:8px; transition:background 0.15s, color 0.15s;
  }
  .nav-links a:hover{ color:var(--ink); background:var(--grey-soft); }
  .nav-links a.active{ color:var(--ink); background:var(--accent-soft); }
  .nav-right{ display:flex; align-items:center; gap:6px; }
  .icon-btn{
    width:38px; height:38px; border-radius:8px; border:1px solid transparent; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2);
    transition:background 0.15s, border-color 0.15s;
  }
  .icon-btn:hover{ background:var(--grey-soft); color:var(--ink); }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; cursor:pointer;
    border:none; font-family:'IBM Plex Mono',monospace;
  }
  .hamburger{ display:none; }
  .profile-menu{
    position:absolute; right:24px; top:60px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow-modal); width:220px; padding:6px; z-index:60;
  }
  .profile-menu .who{ padding:10px 12px 8px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .profile-menu .who .name{ font-weight:600; font-size:14px; }
  .profile-menu .who .email{ font-size:12.5px; color:var(--ink-3); }
  .profile-menu button{
    width:100%; text-align:left; background:none; border:none; padding:9px 12px; font-size:13.5px;
    border-radius:7px; cursor:pointer; color:var(--ink-2);
  }
  .profile-menu button:hover{ background:var(--grey-soft); color:var(--ink); }

  @media (max-width:820px){
    .nav-links{
      display:none; position:absolute; top:64px; left:0; right:0; background:var(--surface);
      border-bottom:1px solid var(--border); flex-direction:column; align-items:stretch; padding:8px; gap:2px;
      box-shadow:0 8px 24px rgba(0,0,0,0.06);
    }
    .nav-links.open{ display:flex; }
    .nav-links a{ padding:12px 14px; }
    .hamburger{ display:flex; }
  }

  /* ---------- Search overlay ---------- */
  .search-overlay{
    position:fixed; inset:0; background:rgba(20,22,20,0.35); z-index:70; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  }
  .search-panel{ width:min(560px,90vw); background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-modal); padding:16px; }
  .search-panel input{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:15px; font-family:inherit;
    background:var(--bg);
  }
  .search-panel .hint{ font-size:12.5px; color:var(--ink-3); margin-top:10px; padding:0 2px; }

  /* ---------- Page header ---------- */
  .page-head{ padding:40px 0 20px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:10px; }
  .page-head h1{ font-size:34px; margin:0 0 10px; font-weight:600; letter-spacing:-0.01em; }
  .page-head p{ font-size:15.5px; color:var(--ink-2); max-width:560px; margin:0; }
  @media (max-width:640px){ .page-head h1{ font-size:26px; } .page-head{padding:28px 0 16px;} }

  /* ---------- Dashboard summary ---------- */
  .summary-row{ display:flex; gap:12px; flex-wrap:wrap; margin:20px 0 8px; }
  .summary-chip{
    flex:1 1 160px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px;
  }
  .summary-chip .num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--accent); }
  .summary-chip .label{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }

  /* ---------- Search + filters ---------- */
  .toolbar{ display:flex; gap:10px; margin:22px 0 6px; flex-wrap:wrap; }
  .search-inline{ position:relative; flex:1 1 260px; }
  .search-inline input{
    width:100%; padding:11px 14px 11px 38px; border:1px solid var(--border); border-radius:8px; font-size:14.5px;
    background:var(--surface); font-family:inherit;
  }
  .search-inline svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3); }
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 8px; }
  .filter-chip{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2); font-size:13px; font-weight:500;
    padding:7px 13px; border-radius:20px; cursor:pointer; white-space:nowrap; transition:all 0.12s;
  }
  .filter-chip:hover{ border-color:var(--border-strong); }
  .filter-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  /* ---------- Groups ---------- */
  .group{ margin-top:34px; }
  .group-title{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .group-title h2{ font-size:18px; margin:0; font-weight:600; }
  .group-title .count{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-3); background:var(--grey-soft); padding:2px 8px; border-radius:20px; }
  .group-dot{ width:8px; height:8px; border-radius:50%; }
  .dot-soon{ background:var(--gold); }
  .dot-upcoming{ background:var(--accent); }
  .dot-later{ background:var(--ink-3); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }

  /* ---------- Event card (ticket stub) ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-card); display:flex; flex-direction:column; cursor:pointer;
    transition:border-color 0.15s, transform 0.1s;
  }
  .card:hover{ border-color:var(--border-strong); }
  .card.completed{ opacity:0.68; }
  .card-body{ padding:18px 18px 16px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .code-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em;
    background:var(--accent-soft); color:var(--accent-dark); padding:4px 8px; border-radius:5px;
  }
  .status-badge{ font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .status-badge::before{ content:""; width:6px; height:6px; border-radius:50%; }
  .status-upcoming{ background:var(--grey-soft); color:var(--ink-2); }
  .status-upcoming::before{ background:var(--ink-3); }
  .status-today{ background:var(--gold-soft); color:var(--gold); }
  .status-today::before{ background:var(--gold); }
  .status-ongoing{ background:var(--accent-soft); color:var(--accent-dark); }
  .status-ongoing::before{ background:var(--accent); }
  .status-completed{ background:var(--grey-soft); color:var(--ink-3); }
  .status-completed::before{ background:var(--ink-3); }

  .card h3{ font-size:17px; margin:0 0 8px; font-weight:600; line-height:1.3; }
  .card .desc{ font-size:13.5px; color:var(--ink-2); margin:0 0 14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta-line{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); margin-bottom:6px; }
  .meta-line svg{ flex:none; color:var(--ink-3); }
  .meta-line .mono{ font-size:12.5px; }
  .countdown-line{ font-size:12px; color:var(--gold); font-weight:600; margin-top:4px; font-family:'IBM Plex Mono',monospace; }

  .card-divider{ position:relative; border-top:1px dashed var(--border-strong); margin:0 18px; }
  .card-divider::before, .card-divider::after{
    content:""; position:absolute; top:-8px; width:16px; height:16px; border-radius:50%; background:var(--bg);
    border:1px solid var(--border);
  }
  .card-divider::before{ left:-26px; }
  .card-divider::after{ right:-26px; }

  .card-foot{ display:flex; align-items:center; justify-content:space-between; padding:13px 18px 16px; }
  .interested-count{ font-size:12.5px; color:var(--ink-2); }
  .interested-count strong{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .btn-interest{
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:7px; cursor:pointer; transition:all 0.12s; white-space:nowrap;
  }
  .btn-interest.active{ background:var(--surface); color:var(--accent); }
  .btn-interest:hover{ transform:translateY(-1px); }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:64px 24px; border:1px dashed var(--border-strong); border-radius:var(--radius);
    margin-top:20px; background:var(--surface);
  }
  .empty-state .icon{ width:44px; height:44px; margin:0 auto 16px; color:var(--ink-3); }
  .empty-state h3{ font-size:17px; margin:0 0 6px; }
  .empty-state p{ font-size:14px; color:var(--ink-2); margin:0; max-width:340px; margin-inline:auto; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,22,20,0.45); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{
    background:var(--surface); border-radius:14px; width:min(620px,100%); max-height:88vh; overflow-y:auto;
    box-shadow:var(--shadow-modal); position:relative;
  }
  .modal-head{ padding:26px 26px 0; }
  .modal-close{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-2);
  }
  .modal-close:hover{ background:var(--grey-soft); }
  .modal-top-row{ display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .modal h2{ font-size:24px; margin:0 0 16px; font-weight:600; line-height:1.3; padding-right:30px; }
  .modal-meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin-bottom:20px; }
  @media (max-width:520px){ .modal-meta-grid{ grid-template-columns:1fr; } }
  .meta-item .k{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-3); font-weight:600; margin-bottom:4px; }
  .meta-item .v{ font-size:14.5px; font-weight:500; }
  .modal-divider{ border-top:1px solid var(--border); margin:0 26px; }
  .modal-body{ padding:20px 26px 26px; }
  .modal-body .desc{ font-size:14.5px; color:var(--ink-2); line-height:1.65; margin:0 0 22px; }
  .modal-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn-primary{
    background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); font-weight:600; font-size:14.5px;
    padding:11px 20px; border-radius:8px; cursor:pointer;
  }
  .btn-primary.active{ background:var(--surface); color:var(--accent); }
  .btn-secondary{
    background:var(--surface); border:1px solid var(--border-strong); color:var(--ink); font-weight:500; font-size:14px;
    padding:11px 16px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .btn-secondary.on{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:var(--shadow-modal);
    display:flex; align-items:center; gap:8px; opacity:0; transition:opacity 0.2s, transform 0.2s;
  }
  .toast.show{ opacity:1; }

  /* ---------- Interests page ---------- */
  .reminder-panel{ background:var(--gold-soft); border:1px solid #EBD9AE; border-radius:var(--radius); padding:16px 18px; margin:22px 0; }
  .reminder-panel h3{ font-size:13.5px; margin:0 0 10px; color:var(--gold); text-transform:uppercase; letter-spacing:0.04em; font-family:'IBM Plex Mono',monospace; }
  .reminder-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:14px; }
  .reminder-row + .reminder-row{ border-top:1px solid #EBD9AE; }
  .list-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:10px; cursor:pointer;
  }
  .list-row:hover{ border-color:var(--border-strong); }
  .list-row .left h3{ font-size:15.5px; margin:0 0 6px; font-weight:600; }
  .list-row .meta-line{ margin-bottom:3px; }
  .list-row .right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none; }

  /* ---------- Calendar ---------- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 16px; }
  .cal-head h2{ font-size:19px; margin:0; font-weight:600; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-2);
  }
  .cal-nav button:hover{ background:var(--grey-soft); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:0.04em; padding-bottom:6px; }
  .cal-cell{
    aspect-ratio:1/1; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex;
    flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; gap:3px;
    min-height:0;
  }
  .cal-cell.empty{ border:none; background:transparent; cursor:default; }
  .cal-cell:not(.empty):hover{ border-color:var(--border-strong); }
  .cal-cell .d{ font-size:13px; font-weight:500; font-family:'IBM Plex Mono',monospace; }
  .cal-cell.today{ border-color:var(--accent); }
  .cal-cell.today .d{ color:var(--accent); font-weight:700; }
  .cal-cell.selected{ background:var(--accent-soft); border-color:var(--accent); }
  .cal-dots{ display:flex; gap:2px; }
  .cal-dots span{ width:4px; height:4px; border-radius:50%; background:var(--accent); }
  @media (max-width:480px){ .cal-cell .d{ font-size:11.5px; } }

  .day-panel{ margin-top:24px; }
  .day-panel h3{ font-size:15px; margin:0 0 12px; font-weight:600; }

  footer.app-foot{ margin-top:auto; border-top:1px solid var(--border); padding:26px 0; text-align:center; }
  footer.app-foot p{ font-size:12.5px; color:var(--ink-3); margin:0; }

  .hidden{ display:none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

/* ============================= DATA ============================= */
const DAY = 24*60*60*1000;
function addDays(base, n){ const d = new Date(base); d.setDate(d.getDate()+n); return d; }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const today0 = new Date(); today0.setHours(0,0,0,0);

function mkEvent(o){
  const start = addDays(today0, o.offset);
  const [h,m] = o.time.split(':').map(Number);
  start.setHours(h,m,0,0);
  let end;
  if(o.offsetEnd !== undefined){
    end = addDays(today0, o.offsetEnd);
    end.setHours(23,59,59,0);
  } else {
    end = new Date(start);
    end.setHours(23,59,59,0);
  }
  return {
    id: o.id, title:o.title, category:o.category, code:o.code,
    start, end, venue:o.venue, organizer:o.organizer, desc:o.desc, baseInterest:o.interest,
    dateLabel: start.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}),
    timeLabel: start.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'}),
    multiDay: o.offsetEnd !== undefined
  };
}

const CATEGORY_CODES = {
  'Technical':'TECH','Hackathon':'HACK','Workshop':'WKSP','Cultural':'CULT',
  'Sports':'SPRT','Seminar':'SEM','Competition':'COMP','Club Event':'CLUB'
};
let codeCounter = 100;
function code(cat){ codeCounter += 15; return CATEGORY_CODES[cat] + ' ' + (codeCounter); }

const RAW_EVENTS = [
  { id:'e1', title:'Inter-College Basketball Tournament', category:'Sports', offset:0, time:'18:00',
    venue:'Main Sports Arena', organizer:'Athletics Department', interest:210,
    desc:'Eight colleges compete for the season championship. Semifinals kick off the evening, followed by the final and an awards ceremony on the main court.' },
  { id:'e2', title:'National Science Exhibition', category:'Technical', offset:-2, offsetEnd:1, time:'09:00',
    venue:'Central Exhibition Hall', organizer:'Science Council', interest:275,
    desc:'A three-day exhibition of student research, working prototypes, and live demonstrations spanning physics, chemistry, and applied engineering. Open to all departments.' },
  { id:'e3', title:"Photography Club Meetup", category:'Club Event', offset:1, time:'16:00',
    venue:'Fine Arts Courtyard', organizer:'Photography Club', interest:56,
    desc:'A relaxed monthly gathering for the Photography Club. Bring your camera, share recent shots for feedback, and join a short golden-hour walk around campus.' },
  { id:'e4', title:'AI & Machine Learning Workshop', category:'Workshop', offset:3, time:'10:00',
    venue:'Engineering Hall, Room 204', organizer:'Computer Science Society', interest:142,
    desc:'A hands-on session covering the fundamentals of neural networks, with a guided lab building and training a simple image classifier from scratch.' },
  { id:'e5', title:'Entrepreneurship Seminar', category:'Seminar', offset:6, time:'15:00',
    venue:'Business School Auditorium', organizer:'E-Cell', interest:87,
    desc:'Founders of three companies started on campus share what it actually took to go from a dorm-room idea to a funded business, followed by open Q&A.' },
  { id:'e6', title:'Web Development Bootcamp', category:'Workshop', offset:9, time:'09:00',
    venue:'Computer Lab 3', organizer:'Web Development Club', interest:98,
    desc:'A full-day intensive on modern front-end fundamentals. Participants leave with a personal site built and deployed live.' },
  { id:'e7', title:'Campus Hackathon 2026', category:'Hackathon', offset:15, offsetEnd:16, time:'09:00',
    venue:'Innovation Center', organizer:'Tech Entrepreneurs Club', interest:328,
    desc:'24 hours of building in teams of up to four, tackling real problem statements submitted by campus and industry partners. Prizes for the top three projects.' },
  { id:'e8', title:'Coding Competition', category:'Competition', offset:22, time:'11:00',
    venue:'Computer Science Department', organizer:'ACM Student Chapter', interest:156,
    desc:'A timed, individual competitive-programming contest across three difficulty tiers. Open to all years, with separate leaderboards for beginners.' },
  { id:'e9', title:'Career Fair 2026', category:'Seminar', offset:27, time:'10:00',
    venue:'Main Quad', organizer:'Career Services Office', interest:189,
    desc:'Meet recruiters from more than forty companies across engineering, finance, design, and consulting. Bring several copies of your resume.' },
  { id:'e10', title:'Cultural Night', category:'Cultural', offset:34, time:'18:30',
    venue:'University Auditorium', organizer:'Cultural Committee', interest:415,
    desc:'An evening of music, dance, and drama from every college society on campus, closing with a joint finale performance.' },

/* ============================= HELPERS ============================= */
function now(){ return new Date(); }

function getStatus(e){
  const n = now();
  if(n > e.end) return 'Completed';
  if(n >= e.start && n <= e.end) return 'Ongoing';
  if(dateKey(n) === dateKey(e.start)) return 'Happening Today';
  return 'Upcoming';
}

function statusBadgeClass(s){
  return { 'Upcoming':'status-upcoming', 'Happening Today':'status-today',
           'Ongoing':'status-ongoing', 'Completed':'status-completed' }[s];
}

function countdownLabel(e){
  const s = getStatus(e);
  if(s === 'Completed') return null;
  if(s === 'Ongoing') return 'Happening now';
  const diff = e.start - now();
  if(diff <= 0) return 'Happening now';
  const days = Math.floor(diff / DAY);
  if(days >= 1) return 'Starts in ' + days + (days===1?' day':' days');
  const hrs = Math.floor(diff / (60*60*1000));
  const mins = Math.floor((diff % (60*60*1000)) / 60000);
  return 'Starts in ' + hrs + 'h ' + mins + 'm';
}

function interestCount(e){
  const st = state.interest[e.id];
  return e.baseInterest + (st && st.interested ? 1 : 0);
}

function daysUntil(e){ return Math.floor((e.start - now())/DAY); }

function groupOf(e){
  const s = getStatus(e);
  if(s === 'Completed') return null;
  const d = daysUntil(e);
  if(s === 'Ongoing' || s === 'Happening Today' || d <= 3) return 'soon';
  if(d <= 21) return 'upcoming';
  return 'later';
}

function matchesQuery(e, q){
  if(!q) return true;
  q = q.toLowerCase();
  return e.title.toLowerCase().includes(q) || e.category.toLowerCase().includes(q) ||
         e.organizer.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q);
}

function matchesCategory(e, cat){ return cat === 'All' || e.category === cat; }

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer = null;
function showToast(msg){
  clearTimeout(toastTimer);
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=> t.classList.add('show'));
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ============================= RENDER: CALENDAR ============================= */
function renderCalendarPage(){
  const monthStart = state.calMonth;
  const monthLabel = monthStart.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const firstDow = monthStart.getDay();
  const daysInMonth = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0).getDate();

  const eventsByDate = {};
  EVENTS.forEach(e => {
    let d = new Date(e.start); d.setHours(0,0,0,0);
    const endD = new Date(e.end); endD.setHours(0,0,0,0);
    while(d <= endD){
      const k = dateKey(d);
      (eventsByDate[k] = eventsByDate[k] || []).push(e);
      d = addDays(d,1);
    }
  });

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
    const k = dateKey(d);
    const isToday = k === dateKey(today0);
    const isSelected = k === state.calSelected;
    const evs = eventsByDate[k] || [];
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-cal-day="${k}" tabindex="0" role="button" aria-label="${d.toDateString()}${evs.length?', '+evs.length+' events':''}">
        <span class="d">${day}</span>
        ${evs.length ? `<span class="cal-dots">${evs.slice(0,3).map(()=>'<span></span>').join('')}</span>` : ''}
      </div>`;
  }

  const selectedEvents = (eventsByDate[state.calSelected] || []).sort((a,b)=>a.start-b.start);
  const selectedDate = new Date(state.calSelected + 'T00:00:00');

  return `
  <div class="wrap">
    <div class="page-head">
      <div class="eyebrow">Plan ahead</div>
      <h1>Calendar</h1>
      <p>See what's scheduled on any day — click a date to view its events.</p>
    </div>

    <div class="cal-head">
      <h2>${monthLabel}</h2>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="Previous month">${ICONS.chevLeft}</button>
        <button id="cal-today" aria-label="Jump to today" style="width:auto; padding:0 12px; font-size:12.5px; font-weight:600;">Today</button>
        <button id="cal-next" aria-label="Next month">${ICONS.chevRight}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>

    <div class="day-panel">
      <h3>${selectedDate.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'})}</h3>
      ${selectedEvents.length === 0 ? `
        <div class="empty-state" style="padding:36px 20px;">
          <h3 style="font-size:15px;">No events on this day</h3>
          <p>Pick another date, or browse all events from the Events tab.</p>
        </div>
      ` : selectedEvents.map(e => `
        <div class="list-row" data-open="${e.id}">
          <div class="left">
            <h3>${esc(e.title)}</h3>
            <div class="meta-line">${ICONS.clock}<span class="mono">${e.timeLabel}</span><span style="color:var(--ink-3)">·</span>${ICONS.pin}<span>${esc(e.venue)}</span></div>
          </div>
          <div class="right"><span class="status-badge ${statusBadgeClass(getStatus(e))}">${getStatus(e)}</span></div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

  if(state.page === 'events') page = renderEventsPage();
  else if(state.page === 'calendar') page = renderCalendarPage();
  else if(state.page === 'interests') page = renderInterestsPage();

  app.innerHTML = `
    ${renderNav()}
    <main style="flex:1; padding-bottom:60px;">${page}</main>
    <footer class="app-foot"><p>Campus Events — built for students, by students.</p></footer>
    ${state.searchOpen ? `
      <div class="search-overlay" id="search-overlay">
        <div class="search-panel">
          <input type="text" id="overlay-search" placeholder="Search by title, category, organizer, or venue" value="${esc(state.query)}" autofocus>
          <div class="hint">Press Esc to close · results filter live on the Events page</div>
        </div>
      </div>` : ''}
    ${renderModal()}
  `;
  bind();

  const os = document.getElementById('overlay-search');
  if(os){ os.focus(); const v = os.value; os.value=''; os.value=v; }
}

/* ============================= BINDINGS ============================= */
function bind(){
  const app = document.getElementById('app');

  // nav
  const hamburger = document.getElementById('btn-hamburger');
  if(hamburger) hamburger.onclick = () => { state.navOpen = !state.navOpen; render(); };

  app.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.preventDefault(); setPage(el.getAttribute('data-page')); });
  });

  const btnSearch = document.getElementById('btn-search');
  if(btnSearch) btnSearch.onclick = () => { state.searchOpen = true; state.profileOpen=false; render(); };

  const btnProfile = document.getElementById('btn-profile');
  if(btnProfile) btnProfile.onclick = (ev) => { ev.stopPropagation(); state.profileOpen = !state.profileOpen; state.searchOpen=false; render(); };

  const overlay = document.getElementById('search-overlay');
  if(overlay) overlay.addEventListener('click', (ev) => { if(ev.target === overlay){ state.searchOpen=false; render(); } });
  const overlaySearch = document.getElementById('overlay-search');
  if(overlaySearch){
    overlaySearch.addEventListener('input', (ev) => { state.query = ev.target.value; });
    overlaySearch.addEventListener('keydown', (ev) => {
      if(ev.key === 'Escape'){ state.searchOpen=false; render(); }
      if(ev.key === 'Enter'){ state.searchOpen=false; setPage('events'); }
    });
  }

  const inlineSearch = document.getElementById('inline-search');
  if(inlineSearch){
    inlineSearch.addEventListener('input', (ev) => {
      const pos = ev.target.selectionStart;
      state.query = ev.target.value;
      render();
      const again = document.getElementById('inline-search');
      if(again){ again.focus(); again.setSelectionRange(pos,pos); }
    });
  }

  // filters
  app.querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => { state.category = el.getAttribute('data-cat'); render(); };
  });

  // interest buttons
  app.querySelectorAll('[data-interest]').forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); toggleInterest(el.getAttribute('data-interest')); };
  });
  // reminder buttons
  app.querySelectorAll('[data-reminder]').forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); if(!el.disabled) toggleReminder(el.getAttribute('data-reminder')); };
  });

  // open modal (cards + list rows), keyboard accessible
  app.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => openModal(el.getAttribute('data-open')));
    el.addEventListener('keydown', (ev) => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); openModal(el.getAttribute('data-open')); } });
  });

  const modalOverlay = document.getElementById('modal-overlay');
  if(modalOverlay) modalOverlay.addEventListener('click', (ev) => { if(ev.target === modalOverlay) closeModal(); });
  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.onclick = closeModal;

  // calendar nav
  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.onclick = () => { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); render(); };
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.onclick = () => { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); render(); };
  const calTodayBtn = document.getElementById('cal-today');
  if(calTodayBtn) calTodayBtn.onclick = () => { state.calMonth = new Date(today0.getFullYear(), today0.getMonth(), 1); state.calSelected = dateKey(today0); render(); };
  app.querySelectorAll('[data-cal-day]').forEach(el => {
    el.addEventListener('click', () => { state.calSelected = el.getAttribute('data-cal-day'); render(); });
    el.addEventListener('keydown', (ev) => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); state.calSelected = el.getAttribute('data-cal-day'); render(); } });
  });

  // global escape + outside click for profile menu
  document.onkeydown = (ev) => {
    if(ev.key === 'Escape'){
      if(state.modalEventId){ closeModal(); return; }
      if(state.searchOpen){ state.searchOpen=false; render(); return; }
      if(state.profileOpen){ state.profileOpen=false; render(); return; }
    }
  };
  document.onclick = (ev) => {
    if(state.profileOpen && !ev.target.closest('#profile-menu') && !ev.target.closest('#btn-profile')){
      state.profileOpen = false; render();
    }
  };
}

/* live countdown refresh */
setInterval(() => { if(state.page === 'events' || state.modalEventId || state.page === 'interests') render(); }, 60000);

render();
})();
</script>
</body>
</html>
